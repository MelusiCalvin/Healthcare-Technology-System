spring:
  application:
    name: ubuntu-health
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/ubuntu_health}
    username: ${DATABASE_USERNAME:ubuntu_health_app}
    password: ${DATABASE_PASSWORD:}
    hikari:
      pool-name: ubuntu-health-primary-pool
      minimum-idle: ${DATABASE_POOL_MIN_IDLE:2}
      maximum-pool-size: ${DATABASE_POOL_MAX_SIZE:10}
      connection-timeout: ${DATABASE_CONNECTION_TIMEOUT_MS:5000}
      validation-timeout: ${DATABASE_VALIDATION_TIMEOUT_MS:3000}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    locations: classpath:db/migration
    validate-migration-naming: true
    clean-disabled: true
  lifecycle:
    timeout-per-shutdown-phase: 30s
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework
  compression:
    enabled: true
  error:
    whitelabel:
      enabled: false

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
    env:
      enabled: false
    configprops:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

springdoc:
  api-docs:
    path: /api/v1/openapi
  swagger-ui:
    path: /api/v1/docs
    operations-sorter: alpha

ubuntu-health:
  name: Ubuntu Health
  environment: ${APP_ENVIRONMENT:local}
  version: ${APP_VERSION:0.1.0-SNAPSHOT}

logging:
  level:
    root: INFO
    za.co.ubuntuhealth: INFO
