spring:
  application:
    name: ubuntu-health
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/ubuntu_health}
    username: ${DATABASE_USERNAME:ubuntu_health_app}
    password: ${DATABASE_PASSWORD:}
    hikari:
      pool-name: ubuntu-health-primary-pool
      minimum-idle: ${DATABASE_POOL_MIN_IDLE:2}
      maximum-pool-size: ${DATABASE_POOL_MAX_SIZE:10}
      connection-timeout: ${DATABASE_CONNECTION_TIMEOUT_MS:5000}
      validation-timeout: ${DATABASE_VALIDATION_TIMEOUT_MS:3000}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    locations: classpath:db/migration
    validate-migration-naming: true
    clean-disabled: true
  lifecycle:
    timeout-per-shutdown-phase: 30s
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework
  compression:
    enabled: true
  error:
    whitelabel:
      enabled: false

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
    env:
      enabled: false
    configprops:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

springdoc:
  api-docs:
    path: /api/v1/openapi
  swagger-ui:
    path: /api/v1/docs
    operations-sorter: alpha

ubuntu-health:
  name: Ubuntu Health
  environment: ${APP_ENVIRONMENT:local}
  version: ${APP_VERSION:0.1.0-SNAPSHOT}
  security:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
    jwt:
      issuer: ${JWT_ISSUER:ubuntu-health}
      audience: ${JWT_AUDIENCE:ubuntu-health-api}
      key-id: ${JWT_KEY_ID:ubuntu-health-key-1}
      private-key-base64: ${JWT_PRIVATE_KEY_BASE64:}
      public-key-base64: ${JWT_PUBLIC_KEY_BASE64:}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT15M}
    refresh-token:
      ttl: ${REFRESH_TOKEN_TTL:P30D}
      cookie-name: ${REFRESH_TOKEN_COOKIE_NAME:ubuntu_health_refresh}
      secure-cookie: ${REFRESH_TOKEN_SECURE_COOKIE:false}
      same-site: ${REFRESH_TOKEN_SAME_SITE:Strict}
    login-rate-limit:
      max-failures: ${LOGIN_RATE_LIMIT_MAX_FAILURES:5}
      window: ${LOGIN_RATE_LIMIT_WINDOW:PT15M}
      lockout: ${LOGIN_RATE_LIMIT_LOCKOUT:PT15M}
      subject-pepper: ${LOGIN_RATE_LIMIT_SUBJECT_PEPPER:}
    bootstrap-admin:
      enabled: ${BOOTSTRAP_ADMIN_ENABLED:false}
      username: ${BOOTSTRAP_ADMIN_USERNAME:}
      email: ${BOOTSTRAP_ADMIN_EMAIL:}
      display-name: ${BOOTSTRAP_ADMIN_DISPLAY_NAME:}
      password: ${BOOTSTRAP_ADMIN_PASSWORD:}

logging:
  level:
    root: INFO
    za.co.ubuntuhealth: INFO
